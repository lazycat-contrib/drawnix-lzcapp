version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/drawnix.lpk

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: drawnix

build:
  run_buildscript: false

images:
  - id: drawnix
    target: service
    service: drawnix
    source: pubuzhixing/drawnix
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Drawnix
    summary: 支持思维导图、流程图和自由绘制的一体化开源白板

